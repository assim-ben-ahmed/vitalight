name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r api/requirements-dev.txt
      - run: npm ci
      - name: Rule engine parity (TypeScript -> golden file)
        run: npm run golden && git diff --exit-code api/tests/golden_rules.json
      - name: API and model tests
        run: npm test
      - name: Typecheck and build frontend
        run: npm run build
      - name: Dev server serves the model JSON (not swallowed by the /api proxy)
        run: |
          npx vite --port 5180 --strictPort &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5180/ && break; sleep 1; done
          curl -sf "http://localhost:5180/api/models/vitalight-model.json?import" -o /dev/null
      - name: Docker image builds
        run: docker build -t vitalight .
